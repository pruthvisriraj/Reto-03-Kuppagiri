# Render Blueprint: New > Blueprint > pick this repo. Render builds the Dockerfile.
# Render asks for the two secret values (sync: false) during setup. They never live in the repo.
services:
  - type: web
    name: reto-03-po-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_KEY
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: RATE_LIMIT_PER_MIN
        value: "15"
      - key: MAX_TOKENS_PER_SESSION
        value: "150000"
      - key: MAX_TOKENS_PER_DAY
        value: "1000000"
